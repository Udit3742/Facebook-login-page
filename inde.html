<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="content">
        <h1>Facebook</h1>
        <p>Facebook helps you connect and share 
        <br>with the  people in your life.</p>
    
        </div>
    </div>


    <div class="box">
    <form id="loginForm">
        <input id="email" type="email" placeholder="Enter Your Email">
        <br>
        <input id="password" type="password" placeholder="Password">
        <br>
        <div class="btn1">    
            <button id="btn1" type="submit">Log In</button>
        </div>
    </form>
    <p id="forgotPasswordText" style="cursor: pointer;">Forgot password?</p>
    
    <div class="btn2">
    <button id="btn2" type="button">Create New Account</button>
    </div>
    </div>
</div>
    <script src="index.js"></script>
</body>
</html>
